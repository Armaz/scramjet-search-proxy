<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scramjet Search</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background: rgba(0,0,0,0.4);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(10px);
        }
        .navbar h1 {
            font-size: 1.4rem;
            flex-shrink: 0;
            font-weight: 700;
        }
        .navbar-search {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 450px;
        }
        .navbar-search input {
            flex: 1;
            padding: 9px 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }
        .navbar-search input:focus {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
        }
        .navbar-search input::placeholder { color: rgba(255,255,255,0.5); }
        .navbar-search button {
            padding: 9px 18px;
            border: none;
            border-radius: 20px;
            background: #22c55e;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .navbar-search button:hover {
            filter: brightness(0.9);
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
            text-align: center;
            flex: 1;
        }
        .hero h2 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #22c55e, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }
        .hero p {
            font-size: 1.15rem;
            color: rgba(255,255,255,0.75);
            margin-bottom: 50px;
        }
        .search-box {
            display: flex;
            gap: 12px;
            max-width: 620px;
            width: 100%;
        }
        .search-box input {
            flex: 1;
            padding: 16px 22px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus {
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 0 20px rgba(34,197,94,0.2);
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.5); }
        .search-box button {
            padding: 16px 40px;
            border: none;
            border-radius: 999px;
            background: #22c55e;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.05rem;
            transition: all 0.3s;
        }
        .search-box button:hover {
            filter: brightness(0.9);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34,197,94,0.3);
        }
        .results-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        #proxyFrame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 40px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .loading.show { display: block; }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(34, 197, 94, 0.2);
            border-top: 4px solid #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🚀 Scramjet</h1>
        <div class="navbar-search">
            <input id="navSearchInput" type="text" placeholder="Quick search..." />
            <button onclick="searchFromNav()">Go</button>
        </div>
    </div>

    <div class="container">
        <div class="hero" id="hero">
            <h2>Scramjet Search</h2>
            <p>Browse DuckDuckGo freely with Scramjet proxy</p>
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="Search anything..." autocomplete="off" />
                <button onclick="search()">Search</button>
            </div>
        </div>

        <div class="results-container" id="resultsContainer" style="display: none;">
            <iframe id="proxyFrame"></iframe>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading search results...</p>
        </div>
    </div>

    <script>
        // Your Wisp backend server URL (change this to your actual server)
        const WISP_BACKEND = 'https://your-wisp-server.com';

        function encodeUrl(url) {
            // Use base64 encoding for the URL
            return btoa(url);
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        function showResults(show) {
            document.getElementById('resultsContainer').style.display = show ? 'flex' : 'none';
            document.getElementById('hero').style.display = show ? 'none' : 'flex';
        }

        function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            performSearch(query);
        }

        function searchFromNav() {
            const query = document.getElementById('navSearchInput').value.trim();
            if (query) {
                document.getElementById('searchInput').value = query;
                performSearch(query);
            }
        }

        function performSearch(query) {
            showLoading(true);
            showResults(true);

            try {
                // Build DuckDuckGo search URL
                const searchUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
                
                // Encode the URL in base64 for the Wisp proxy
                const encodedUrl = encodeUrl(searchUrl);
                
                // Construct the proxied URL
                // Format: https://wisp-server.com/?uri=base64(target-url)
                const proxiedUrl = `${WISP_BACKEND}/?uri=${encodedUrl}`;
                
                console.log('Proxying to:', proxiedUrl);
                
                const frame = document.getElementById('proxyFrame');
                frame.onload = () => {
                    showLoading(false);
                };
                frame.onerror = () => {
                    showLoading(false);
                    console.error('Failed to load proxy frame');
                };
                frame.src = proxiedUrl;
            } catch (e) {
                console.error('Search error:', e);
                showLoading(false);
            }
        }

        // Enter key handlers
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') search();
        });

        document.getElementById('navSearchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchFromNav();
        });

        // Handle goto parameter (for links that escape the proxy)
        const params = new URLSearchParams(window.location.search);
        const goto = params.get('goto');
        if (goto) {
            document.getElementById('searchInput').value = goto;
            search();
        }

        document.getElementById('searchInput').focus();
    </script>
</body>
</html>
