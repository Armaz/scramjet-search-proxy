<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scramjet Search - Wisp Proxy</title>
    
    <!-- Scramjet Bundles -->
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="/libcurl/index.js"></script>
    
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="navbar">
        <h1>🚀 Scramjet Search</h1>
        <div class="navbar-search">
            <input id="navSearchInput" type="text" placeholder="Quick search..." />
            <button onclick="searchFromNav()">Go</button>
        </div>
    </div>

    <div class="container">
        <div class="hero" id="hero">
            <h2>Scramjet Search</h2>
            <p>Browse DuckDuckGo freely through Scramjet + Wisp proxy</p>
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="Search anything..." autocomplete="off" />
                <button onclick="search()">Search</button>
            </div>
        </div>

        <div class="results-container" id="resultsContainer" style="display: none;">
            <div class="results-header">
                <button onclick="backToHome()" class="back-btn">← Back</button>
                <span id="searchQuery" class="search-query"></span>
            </div>
            <iframe id="proxyFrame"></iframe>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Proxying search through Scramjet...</p>
        </div>

        <div class="error" id="error" style="display: none;"></div>
    </div>

    <script>
        let controller = null;
        let frame = null;
        let isInitializing = false;

        // Auto-detect Wisp URL
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const hostname = window.location.hostname;
        const port = window.location.port;
        const wispPort = port === '4141' ? '4142' : (port || (protocol === 'wss:' ? '443' : '80'));
        const WISP_URL = `${protocol}//${hostname}:${wispPort}/`;

        console.log('🔌 Wisp URL:', WISP_URL);

        async function initScramjet() {
            if (controller) {
                console.log('✅ Scramjet already initialized');
                return;
            }
            
            if (isInitializing) {
                console.log('⏳ Scramjet initialization in progress...');
                return;
            }
            
            isInitializing = true;
            showLoading(true);
            showError('');

            try {
                console.log('🚀 Initializing Scramjet...');
                
                // Wait for all Scramjet bundles to load
                await new Promise(resolve => setTimeout(resolve, 500));
                
                if (!window.LibcurlTransport) {
                    throw new Error('LibcurlTransport not loaded');
                }
                if (!window.$scramjetController) {
                    throw new Error('Scramjet Controller not loaded');
                }
                if (!window.$scramjetUtils) {
                    throw new Error('Scramjet Utils not loaded');
                }

                // Create LibCurl transport with Wisp
                const LibcurlClient = window.LibcurlTransport.LibcurlClient;
                const transport = new LibcurlClient({ 
                    wisp: WISP_URL,
                    localIp: true
                });
                
                console.log('✅ Transport created');

                // Create Scramjet controller
                const Controller = window.$scramjetController.Controller;
                controller = new Controller({
                    transport: transport,
                });

                console.log('✅ Controller created');

                // Wait for controller to be ready
                await controller.wait();
                
                console.log('✅ Controller ready');

                // Create frame for iframe
                const frameElement = document.getElementById('proxyFrame');
                frame = controller.createFrame(frameElement, {
                    plugins: [
                        new window.$scramjetUtils.HttpCachePlugin(),
                        new window.$scramjetUtils.UrlWatcherPlugin((url) => {
                            console.log('📍 Proxying:', url);
                            document.getElementById('searchQuery').textContent = `Proxying: ${url}`;
                        }),
                        new window.$scramjetUtils.CatchEscapedLinksPlugin((url) => {
                            return new URL(`/?goto=${encodeURIComponent(url.href)}`, location.origin);
                        })
                    ],
                });

                console.log('✅ Frame created');
                console.log('✅ Scramjet fully initialized!');
                showLoading(false);
                isInitializing = false;
            } catch (e) {
                console.error('❌ Scramjet init error:', e);
                showError('Failed to initialize Scramjet: ' + e.message);
                showLoading(false);
                isInitializing = false;
                controller = null;
                frame = null;
                throw e;
            }
        }

        function showError(msg) {
            const errorEl = document.getElementById('error');
            if (msg) {
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
            }
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        function showResults(show) {
            document.getElementById('resultsContainer').style.display = show ? 'block' : 'none';
            document.getElementById('hero').style.display = show ? 'none' : 'flex';
        }

        function backToHome() {
            showResults(false);
            document.getElementById('searchInput').focus();
        }

        function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            performSearch(query);
        }

        function searchFromNav() {
            const query = document.getElementById('navSearchInput').value.trim();
            if (query) {
                document.getElementById('searchInput').value = query;
                performSearch(query);
            }
        }

        async function performSearch(query) {
            showLoading(true);
            showResults(true);
            showError('');
            document.getElementById('searchQuery').textContent = `Searching: ${query}`;

            try {
                // Initialize Scramjet if not already done
                await initScramjet();

                if (!frame) {
                    throw new Error('Frame not initialized');
                }

                // Build DuckDuckGo search URL
                const searchUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
                
                console.log('🔍 Loading search:', searchUrl);
                
                // Navigate through Scramjet proxy
                await frame.go(searchUrl);
                
                console.log('✅ Search loaded');
                showLoading(false);
            } catch (e) {
                console.error('❌ Search error:', e);
                showError('Error loading search: ' + e.message);
                showLoading(false);
                showResults(false);
            }
        }

        // Enter key handlers
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') search();
        });

        document.getElementById('navSearchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchFromNav();
        });

        // Handle goto parameter (for links that escape the proxy)
        const params = new URLSearchParams(window.location.search);
        const goto = params.get('goto');
        if (goto) {
            console.log('🔗 Got redirect:', goto);
            document.getElementById('searchInput').value = goto;
            setTimeout(() => search(), 1000);
        }

        document.getElementById('searchInput').focus();
        
        console.log('🎯 Scramjet Search loaded');
    </script>
</body>
</html>
